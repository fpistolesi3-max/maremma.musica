<!doctype html>
<html lang="it">
<body style="margin:0;background:#0c0f14;color:#e1d7c9;font-family:Barlow,'Helvetica Neue',Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;padding:32px 16px;">
    <p style="font:600 12px/16px Arial,sans-serif;letter-spacing:.24em;color:#a39e95;margin:0 0 24px;">MAREMMA MUSICA</p>
    <h1 style="font:900 40px/1 'Arial Narrow',Arial,sans-serif;text-transform:uppercase;margin:0 0 16px;">Entra nella tua area</h1>
    <p style="font:400 16px/24px Arial,sans-serif;margin:0 0 24px;">Tocca il pulsante per entrare. Il link vale un'ora e funziona una volta sola.</p>
    <p style="margin:0 0 32px;">
      <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
         style="display:inline-block;background:#d55b23;color:#050505;padding:16px 24px;border-radius:2px;font:600 15px/20px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;">Entra →</a>
    </p>
    <p style="font:400 14px/20px Arial,sans-serif;color:#a39e95;margin:0 0 8px;">Oppure scrivi questo codice nella pagina di accesso:</p>
    <p style="font:500 28px/32px 'Courier New',monospace;letter-spacing:.2em;margin:0 0 32px;">{{ .Token }}</p>
    <p style="font:400 12px/18px Arial,sans-serif;color:#77736c;margin:0;">Non hai chiesto tu l'accesso? Ignora questa email.</p>
  </div>
</body>
</html>
